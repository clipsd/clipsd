# ClipSD: build of ClipSD-<version>-Setup.exe on Windows after every push, autotests, and a test of
# install, update over a running ClipSD, failures and uninstall (packaging/windows-exe/install_test.ps1).
# Ready installer: Actions tab -> latest run -> Artifacts -> ClipSD-Setup.
# Actions are pinned by commit SHA (the tag in the comment); update both together.
name: Windows build

on:
  # 23.11.2026 (владелец: минимальный бюджет, сборки Windows реже): минуты GitHub для закрытого репозитория
  # платные сверх месячного запаса. Сборка только для выпуска (метка v*), пробных сборок (proba/*), пакета Store
  # (dev/store-msix) и вручную; проверка между выпусками идёт на компьютере (runfull.sh).
  push:
    tags: ['v*']
    branches: ['proba/**', 'dev/store-msix', 'store/**']
  workflow_dispatch:
    inputs:
      preview:
        description: "Пробная сборка (канал proba, папка на компьютере владельца), не выпуск"
        type: boolean
        default: false
      version:
        description: "Номер версии пробной сборки, например 2.0.1 (пусто: как в исходниках; ветка proba/<версия> задаёт его сама)"
        type: string
        default: ""

# read-only token: the builds publish nothing (no releases, no pages, no pushes)
permissions:
  contents: read

jobs:
  build:
    # на ветках store/** собирается только пакет Store (задание store)
    if: ${{ !startsWith(github.ref, 'refs/heads/store/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"             # Cyrillic in script output (the cloud Windows console is cp1252)
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Inno Setup 6
        shell: pwsh
        run: |
          # always exactly 6.7.1 (a preinstalled other version is replaced). The feed of Chocolatey sometimes answers
          # 503: three tries; if all fail, the version check below decides (the image may already have 6.7.1)
          foreach ($try in 1..3) {
            choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade --force
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "::warning::choco install innosetup: код $LASTEXITCODE (попытка $try из 3)"
            if ($try -lt 3) { Start-Sleep -Seconds 20 }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup не установился" }
          # ISCC.exe of the choco package reports ProductVersion 0.0.0.0: the version is read from every source
          # that knows it (file versions of ISCC.exe, ISCmplr.dll, Compil32.exe; the uninstall entry; choco), the
          # empty and 0.0.0.0 ones are skipped; at least one must be found and all of them must be 6.7.1
          $dir = Split-Path $iscc
          $seen = @()
          foreach ($f in "ISCC.exe", "ISCmplr.dll", "Compil32.exe") {
            $p = Join-Path $dir $f
            if (Test-Path $p) { $vi = (Get-Item $p).VersionInfo; $seen += "$f=$($vi.ProductVersion)", "$f=$($vi.FileVersion)" }
          }
          foreach ($k in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                         "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                         "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1") {
            $d = (Get-ItemProperty $k -ErrorAction SilentlyContinue).DisplayVersion
            if ($d) { $seen += "uninstall=$d" }
          }
          $c = choco list innosetup --exact --limit-output 2>$null | Select-Object -First 1
          if ($c -match '^innosetup\|(.+)$') { $seen += "choco=$($Matches[1])" }
          $vers = $seen | ForEach-Object { ($_ -split "=", 2)[1].Trim() } | Where-Object { $_ -and $_ -notmatch '^0([.,]0)*$' }
          Write-Host "Inno Setup: $($seen -join '; ')"
          if (-not $vers) { throw "Версия Inno Setup не определилась ($($seen -join '; '))" }
          $other = $vers | Where-Object { -not $_.StartsWith("6.7.1") }
          if ($other) { throw "Inno Setup $($other -join ', ') вместо 6.7.1" }
          exit 0   # the checks above passed: an exit code left by a failed choco try is not the result

      # Placeholders (TODO keys, .invalid addresses) fail a v* tag, warn otherwise.
      - name: Проверка выпуска
        run: python tools/release_check.py ${{ startsWith(github.ref, 'refs/tags/v') && '--strict' || '' }}

      - name: Раскладка исходников
        run: python packaging/stage_windows.py winbuild/ClipSD

      - name: Сборка программы, запускателя и установщика
        working-directory: winbuild/ClipSD
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 завершился с ошибкой" }
          if (-not (Test-Path dist\launcher\ClipSD.exe)) { throw "Запускатель не собран" }
          if (-not (Test-Path dist\ClipSD-app\ClipSD-app.exe)) { throw "ClipSD-app.exe не собран" }
          if (-not (Get-ChildItem dist\*-Setup.exe -ErrorAction SilentlyContinue)) { throw "Setup.exe не собран" }
          Get-Item dist\launcher\ClipSD.exe | Format-List Name, Length, @{n="Version"; e={$_.VersionInfo.FileVersion}}

      # The release installer: its program says "build: release" (selfcheck of build.ps1), no preview mark; its
      # SHA-256 goes into SHA256SUMS-release-windows of the artifact, which tools/release.sh assemble --windows-sums
      # compares (a renamed preview installer never matches).
      - name: Проверка выпускной сборки и сумма установщика
        working-directory: winbuild/ClipSD
        shell: pwsh
        run: |
          if (Test-Path PREVIEW) { throw "В выпускной раскладке есть метка PREVIEW" }
          if (Test-Path clipshot\_preview_build.py) { throw "В выпускной раскладке модуль пробной сборки" }
          $report = Get-Content build\selfcheck.txt -Encoding utf8
          if (-not ($report -contains "build: release")) { throw "selfcheck выпускной программы: нет 'build: release'" }
          $setup = (Get-ChildItem dist\*-Setup.exe)[0]
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii -NoNewline dist\SHA256SUMS-release-windows
          Get-Content dist\SHA256SUMS-release-windows

      # From the repository root (tools\channel_sign.py is not in the staged folder), with the build venv:
      # exactly the pinned packages of the release. linux_layout_test is Linux only.
      # Russian OCR for the real Cyrillic recognition check in ocr_win_encoding_test (21.11.2026: text "garbled" on
      # Windows without Russian). Best effort: if Windows Update does not deliver it, the test skips that part with a note.
      - name: Русский язык распознавания текста (если Windows Update даёт)
        continue-on-error: true
        timeout-minutes: 8
        shell: powershell
        run: |
          $name = "Language.OCR~~~ru-RU~0.0.1.0"
          $cap = Get-WindowsCapability -Online -Name $name
          Write-Host "до: $($cap.State)"
          if ($cap.State -ne "Installed") { Add-WindowsCapability -Online -Name $name | Out-Host }
          Write-Host "после: $((Get-WindowsCapability -Online -Name $name).State)"

      - name: Автотесты на Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          # A test that dies inside Qt leaves a trace in the log: unbuffered output, Qt messages (qFatal) to stderr
          # instead of OutputDebugString (okna_imya_test on 1.34.0 ended silently in 0.2 s). No PYTHONFAULTHANDLER
          # for all tests: on Windows it also reports exceptions that are handled (os._exit while Qt unloads) and
          # floods the log; a test that needs it turns it on itself (okna_imya_test)
          PYTHONUNBUFFERED: "1"
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          $py = "winbuild\ClipSD\.venv-build\Scripts\python.exe"
          $outDir = "winbuild\ClipSD\test-out"
          $failed = @()
          & $py -X utf8 tests\test_windows_hidpi.py "$outDir\hidpi"
          if ($LASTEXITCODE -ne 0) { $failed += "test_windows_hidpi" }
          foreach ($t in "smoke_test", "features_test", "ocr_test", "translate_test", "light_test",
                         "updater_test", "update_app_test", "channel_sign_test", "okna_imya_test",
                         "ocr_win_encoding_test") {
            Write-Host "::group::$t"
            if ($t -in "smoke_test", "features_test", "ocr_test", "translate_test", "light_test", "updater_test") {
              & $py -X utf8 "tests\$t.py" . "$outDir\$t"
            } else {
              & $py -X utf8 "tests\$t.py"
            }
            if ($LASTEXITCODE -ne 0) { $failed += $t; Write-Host ("{0}: exit code {1} (0x{1:X8})" -f $t, $LASTEXITCODE) }
            Write-Host "::endgroup::"
          }
          if ($failed) { throw "Не прошли: $($failed -join ', ')" }

      # The same code with version 9.9.9: the "next release" for the update test.
      - name: Вторая сборка с другим номером версии
        shell: pwsh
        run: |
          python packaging/stage_windows.py winbuild/next
          if ($LASTEXITCODE -ne 0) { throw "Раскладка второй сборки не удалась" }
          $init = "winbuild/next/clipshot/__init__.py"
          $text = (Get-Content $init -Raw) -replace '(?m)^__version__ = "[^"]+"', '__version__ = "9.9.9"'
          Set-Content $init $text -NoNewline -Encoding utf8NoBOM
          Push-Location winbuild/next
          python packaging/stamp_version.py
          if ($LASTEXITCODE -ne 0) { throw "stamp_version.py не удался" }
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 второй сборки завершился с ошибкой" }
          Pop-Location

      - name: Установка, обновление при работающей программе, сбои, удаление
        shell: pwsh
        run: |
          $setup = (Get-ChildItem winbuild/ClipSD/dist/*-Setup.exe)[0].FullName
          $next  = (Get-ChildItem winbuild/next/dist/ClipSD-9.9.9-Setup.exe)[0].FullName
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows-exe/install_test.ps1 `
            -Setup $setup -SetupNext $next -LogDir winbuild/ClipSD/test-out/install
          if ($LASTEXITCODE -ne 0) { throw "Проверка установки и обновления не прошла" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          retention-days: 7   # временные сборки: готовые выпуски лежат в Releases; квота артефактов (23.11.2026)
          name: ClipSD-Setup
          path: |
            winbuild/ClipSD/dist/*-Setup.exe
            winbuild/ClipSD/dist/SHA256SUMS-release-windows
            winbuild/ClipSD/test-out/**
          if-no-files-found: warn

      # Preview ("проба") build: on a push to a branch proba/<version> (the version comes from the branch
      # name) or on a manual run with "preview". After the ordinary installer is uploaded. A separate copy
      # of the sources (packaging/preview_build.py); build.ps1 checks that the built exe says "build: preview".
      - name: Пробная сборка (канал proba)
        if: (startsWith(github.ref, 'refs/heads/proba/') || (github.event_name == 'workflow_dispatch' && inputs.preview)) && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PROBA_VERSION: ${{ inputs.version }}
        run: |
          $v = "$env:PROBA_VERSION"
          if ($env:GITHUB_REF -like "refs/heads/proba/*") { $v = $env:GITHUB_REF.Substring("refs/heads/proba/".Length) }
          $pargs = @("packaging/preview_build.py", "$env:RUNNER_TEMP/proba")
          if ($v) { $pargs += @("--version", $v) }
          python @pargs
          if ($LASTEXITCODE -ne 0) { throw "preview_build.py не удался" }
          python "$env:RUNNER_TEMP/proba/packaging/stage_windows.py" winbuild/proba
          if ($LASTEXITCODE -ne 0) { throw "Раскладка пробной сборки не удалась" }
          Push-Location winbuild/proba
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 пробной сборки завершился с ошибкой" }
          Pop-Location
          $setup = (Get-ChildItem winbuild/proba/dist/*-Setup.exe)[0]
          Rename-Item $setup.FullName ($setup.Name -replace '-Setup\.exe$', '-proba-Setup.exe')
          Get-ChildItem winbuild/proba/dist/*-proba-Setup.exe | Format-List Name, Length

      - name: Пробная установка, настоящая поверх неё (9.9.9), удаление
        if: (startsWith(github.ref, 'refs/heads/proba/') || (github.event_name == 'workflow_dispatch' && inputs.preview)) && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $proba = (Get-ChildItem winbuild/proba/dist/*-proba-Setup.exe)[0].FullName
          $next  = (Get-ChildItem winbuild/next/dist/ClipSD-9.9.9-Setup.exe)[0].FullName
          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/windows-exe/preview_test.ps1 `
            -SetupPreview $proba -SetupRelease $next -LogDir winbuild/proba/test-out
          if ($LASTEXITCODE -ne 0) { throw "Проверка пробной установки не прошла" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: (startsWith(github.ref, 'refs/heads/proba/') || (github.event_name == 'workflow_dispatch' && inputs.preview)) && !startsWith(github.ref, 'refs/tags/')
        with:
          retention-days: 7   # временные сборки: готовые выпуски лежат в Releases; квота артефактов (23.11.2026)
          name: ClipSD-Setup-proba
          path: winbuild/proba/dist/*-proba-Setup.exe
          if-no-files-found: error

  # Microsoft Store: MSIX package (packaging/windows-store), the owner's decision 19.11.2026. A separate job: the
  # ordinary installer above is not touched. The Store signs the package itself; here it is built unsigned (for
  # Partner Center) and once more with a throwaway test certificate, installed, started and removed.
  # Result: Actions -> run -> Artifacts -> ClipSD-Store-MSIX.
  store:
    # только на ветках store/** и вручную (на main и метках v* не нужен)
    if: ${{ startsWith(github.ref, 'refs/heads/store/') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Раскладка исходников для Microsoft Store
        run: python packaging/stage_windows.py winbuild/store --store

      # Only ClipSD-app.exe: Windows starts it from the package, the Store updates it (no launcher, no Setup.exe)
      - name: Сборка программы (без запускателя и установщика)
        working-directory: winbuild/store
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1 -AppOnly
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 -AppOnly завершился с ошибкой" }
          $report = Get-Content build\selfcheck.txt -Encoding utf8
          if (-not ($report -contains "build: store")) { throw "selfcheck Store-сборки: нет 'build: store'" }
          if (-not ($report -contains "package: none")) { throw "selfcheck вне пакета: ожидали 'package: none'" }

      - name: Автотест вида сборки Store и раскладки пакета
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & winbuild\store\.venv-build\Scripts\python.exe -X utf8 tests\store_test.py . winbuild\store\test-out\store_test
          if ($LASTEXITCODE -ne 0) { throw "store_test не прошёл" }

      - name: Раскладка пакета MSIX (манифест, значки, описание на 12 языках)
        working-directory: winbuild/store
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & .venv-build\Scripts\python.exe -X utf8 packaging\store\make_msix_layout.py --app dist\ClipSD-app --out build\msix
          if ($LASTEXITCODE -ne 0) { throw "make_msix_layout.py не удался" }

      - name: MSIX (makepri, makeappx) и копия с тестовой подписью
        working-directory: winbuild/store
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\store\build_msix.ps1 `
            -Layout build\msix\layout -PriSource build\msix\pri -OutDir dist\msix -TestSign
          if ($LASTEXITCODE -ne 0) { throw "build_msix.ps1 завершился с ошибкой" }

      # 1.31.2 in the Store had boxes instead of "Clip" and "SD" on its tiles: the tile inside the built package
      # must look like the logo of ClipSD (packaging/windows-store/logo_assets.py, reference/icon-512.png)
      - name: Значок пакета похож на логотип ClipSD (нет квадратиков вместо букв)
        working-directory: winbuild/store
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $msix = (Get-ChildItem dist\msix\ClipSD-*-x64.msix | Where-Object { $_.Name -notlike "*testsigned*" })[0].FullName
          & .venv-build\Scripts\python.exe -X utf8 packaging\store\logo_assets.py --check-msix $msix
          if ($LASTEXITCODE -ne 0) { throw "значок пакета не похож на логотип ClipSD" }

      - name: Установка тестового MSIX, запуск, настройки обычной сборки, удаление
        working-directory: winbuild/store
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem dist\msix\*-testsigned.msix)[0].FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\store\store_test.ps1 `
            -Package $pkg -Cert dist\msix\ClipSD-test-signing.cer -Manifest build\msix\layout\AppxManifest.xml `
            -LogDir test-out\store -KeepCert
          if ($LASTEXITCODE -ne 0) { throw "Проверка пакета MSIX не прошла" }

      # Windows App Certification Kit: the same checks as the Store runs. Not a part of the image of the runner
      # (its Windows SDK is installed without it): the WACK feature of the same SDK is added, the installer is
      # checked for a valid Microsoft signature first. Informational: the job does not fail on it.
      - name: WACK (Windows App Certification Kit)
        continue-on-error: true
        working-directory: winbuild/store
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            $setup = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2349110" -OutFile $setup
            $sig = Get-AuthenticodeSignature $setup
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
              throw "winsdksetup.exe: подпись $($sig.Status), $($sig.SignerCertificate.Subject)"
            }
            $p = Start-Process $setup -ArgumentList "/features OptionId.WindowsSoftwareLogoToolkit /q /norestart /ceip off" -Wait -PassThru
            Write-Host "winsdksetup: код $($p.ExitCode)"
          }
          if (-not (Test-Path $appcert)) { throw "appcert.exe не найден" }
          $pkg = (Get-ChildItem dist\msix\*-testsigned.msix)[0].FullName
          $report = Join-Path (Resolve-Path test-out).Path "wack-report.xml"
          & $appcert reset
          & $appcert test -appxpackagepath $pkg -reportoutputpath $report
          if (-not (Test-Path $report)) { throw "WACK не записал отчёт" }
          [xml]$r = Get-Content $report
          Write-Host "WACK: $($r.REPORT.OVERALL_RESULT)"
          foreach ($t in $r.SelectNodes("//TEST")) {
            $res = $t.SelectSingleNode("RESULT").InnerText
            if ($res -and $res -ne "PASS") { Write-Host "::warning title=WACK::$($t.NAME): $res" }
          }
          if ($r.REPORT.OVERALL_RESULT -eq "FAIL") { throw "WACK: FAIL (подробности в отчёте)" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: ClipSD-Store-MSIX
          path: |
            winbuild/store/dist/msix/**
            winbuild/store/build/msix/layout/AppxManifest.xml
            winbuild/store/build/selfcheck.txt
            winbuild/store/test-out/**
          if-no-files-found: warn
